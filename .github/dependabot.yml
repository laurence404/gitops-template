version: 2

registries:
  dockerhub:
    type: docker-registry
    url: registry.hub.docker.com
    username: ${{secrets.DOCKERHUB_USERNAME}}
    password: ${{secrets.DOCKERHUB_PAT}}

updates:
 - package-ecosystem: docker
   directories:
     - /*/templates
     - /*
   registries:
     - dockerhub
   schedule:
     interval: daily
   commit-message:
     prefix: "chore(docker)"
   # Works for docker.io, but not for ghcr.io (adds a warning into PR)
   cooldown:
     default-days: 7
 - package-ecosystem: helm
   directories: 
     - /*
   exclude-paths:
     # Leave this to docker - see https://github.com/dependabot/dependabot-core/issues/4364
     - "*/values.yaml"
   schedule:
     interval: daily
   commit-message:
     prefix: "chore(helm)"
   # Works for OCI charts (inc. ghcr.io) but not HTTP helm chart repositories (PR will have no warning)
   cooldown:
     default-days: 7
